server:
  port: 8080
  servlet:
    context-path: /sigte/api/v1

spring:
  application:
    name: sigte

  datasource:
    url: jdbc:postgresql://localhost:5432/bd_sigte
    username: postgres
    password: 983603412Juan
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Flyway controlará la creación/modificación del esquema, JPA solo valida
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    schemas: maestros
    default-schema: maestros
    create-schemas: true
    locations: classpath:db/migration